<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reading list · Pagefold Books</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./list.js"></script>
  <script defer src="/vendor/alpinejs@3.13.10/alpine.js"></script>
</head>
<body>
  <header class="site"><h1><a href="/">Pagefold Books</a></h1><span class="muted">Your reading list</span></header>
  <main x-data="readingList()" x-init="load()">
    <h2>Reading list</h2>
    <ul class="list" data-testid="list">
      <template x-for="item in items" :key="item.id">
        <li data-testid="list-item">
          <label><input type="checkbox" :checked="item.done" @change="toggle(item)"> <span x-text="item.title"></span></label>
        </li>
      </template>
    </ul>
    <p class="muted" x-show="items.length === 0">Nothing on your list yet.</p>
    <form @submit.prevent="add()">
      <label for="title">Add a book</label>
      <input id="title" x-model="draft" data-testid="title">
      <p><button class="primary" type="submit" data-testid="add">Add to list</button> <button type="button" @click="undo()" :disabled="history.length === 0" data-testid="undo">Undo</button></p>
    </form>
    <p class="muted" data-testid="latest" x-text="latest ? 'Latest: ' + latest.title : ''"></p>
  </main>
</body>
</html>
